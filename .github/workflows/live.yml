name: board
on:
  workflow_dispatch:
  schedule:
    - cron: "7,22,37,52 13-20 * * 1-5"   # every 15 minutes across the US session (UTC), 7 minutes after Portfolio Pulse publishes, whose figures this page takes
    - cron: "30 21 * * 1-5"        # once after Pulse's post-close publish
concurrency: { group: live, cancel-in-progress: false }
permissions: { contents: write }
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - run: python3 build.py
      - run: |
          git config user.name "Makarios board" && git config user.email "board@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || { git commit -qm "live $(date -u +%FT%TZ)" && git pull -q --rebase origin main && git push -q origin HEAD:main; }
